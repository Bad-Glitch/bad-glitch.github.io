<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEH v13 Exam Simulator</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6b1530">
<style>
:root{box-sizing:border-box;--bg:#faf6f7;--card:#fff;--tx:#2a1620;--mut:#7a6670;--bd:#ecdfe3;--ac:#7b1e3a;--tint:rgba(123,30,58,.08);--bad:#b3261e;--ok:#12805c;--fl:#c98a12;--g:linear-gradient(135deg,#3d0b20 0%,#6b1530 48%,#a02a4b 100%);--sh:0 1px 2px rgba(60,10,30,.06),0 10px 28px rgba(60,10,30,.06);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140910;--card:#1e0f17;--tx:#f3e9ed;--mut:#b7a0aa;--bd:#34202a;--ac:#e0708f;--tint:rgba(224,112,143,.13);--bad:#ff8a80;--ok:#4fd1a0;--fl:#f0b44c;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#140910;--card:#1e0f17;--tx:#f3e9ed;--mut:#b7a0aa;--bd:#34202a;--ac:#e0708f;--tint:rgba(224,112,143,.13);--bad:#ff8a80;--ok:#4fd1a0;--fl:#f0b44c;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}@media print{body{display:none!important}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:880px;margin:0 auto;padding:18px 16px 32px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:var(--sh)}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}h2{font-size:1.08rem;margin:0 0 10px;font-weight:700}.m{color:var(--mut);font-size:.92rem}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 18px;transition:transform .12s,box-shadow .12s,border-color .12s,filter .12s}
button:hover:not(:disabled){border-color:var(--ac)}button:active:not(:disabled){transform:translateY(1px)}
button.p{background:var(--g);color:#fff;border:0;font-weight:600;letter-spacing:.2px;box-shadow:0 6px 16px rgba(107,21,48,.28)}button.p:hover:not(:disabled){filter:brightness(1.1);border:0}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=text]{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=text]:focus{border-color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.hero{position:relative;overflow:hidden;background:var(--g);color:#fff;border:0;border-radius:20px;padding:28px 24px;margin-bottom:16px;box-shadow:0 14px 34px rgba(80,14,38,.32)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 92% -10%,rgba(255,214,160,.30),transparent 52%),radial-gradient(circle at 0% 120%,rgba(255,255,255,.10),transparent 45%)}
.hero>*{position:relative;z-index:1}.hero h1{color:#fff;font-size:clamp(1.55rem,5.5vw,2.1rem);margin:14px 0 4px}
.hero .sub,.hero .m{color:rgba(255,255,255,.82)}
.brand{display:flex;align-items:center;gap:10px;font-size:.72rem;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.9)}
.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);font-weight:800;letter-spacing:0;font-size:.85rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chips span{padding:4px 13px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);font-size:.8rem;font-weight:600}
.chips span:first-child{background:rgba(255,214,160,.2);border-color:rgba(255,214,160,.55);color:#ffe9c7}
.hero .card{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);box-shadow:none}
.hero button{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.hero button.p{background:#fff;color:#6b1530;box-shadow:none}
.hero .pass{color:#b6f2d3}.hero .fail{color:#ffc2cb}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--g);color:#fff;border-radius:16px;padding:12px 16px;margin-bottom:16px;box-shadow:0 8px 22px rgba(80,14,38,.3)}
.top .tag{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
#tm{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem;letter-spacing:.04em;color:#fff}#tm.low{color:#ffd0d6;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
.bar{height:6px;background:rgba(255,255,255,.22);border-radius:6px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffe2b0,#fff);border-radius:6px;transition:width .3s}
.q{font-size:1.08rem;margin:6px 0 16px;line-height:1.6}
.o{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-bottom:9px;padding:13px 15px;border-radius:14px}
.o b{min-width:1.5em;color:var(--ac)}.o.s{border-color:var(--ac);background:var(--tint);box-shadow:inset 0 0 0 1px var(--ac)}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}
.nav button{padding:8px 0;font-size:.85rem;border-radius:10px}.nav .a{background:var(--tint);border-color:var(--ac);color:var(--ac);font-weight:700}
.nav .f{border-color:var(--fl);box-shadow:inset 0 0 0 2px var(--fl)}.nav .c{outline:2px solid var(--ac);outline-offset:1px}
.big{font-size:2.8rem;font-weight:800;line-height:1;letter-spacing:-.02em}.pass{color:var(--ok)}.fail{color:var(--bad)}
.tag{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.hide{display:none}.ov{overflow-x:auto}label.k{display:flex;gap:8px;align-items:center;margin:8px 0;cursor:pointer}
.pbar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;border-radius:8px}
.foot{text-align:center;color:var(--mut);font-size:.78rem;letter-spacing:.06em;margin-top:8px}
</style></head><body><div class="w" id="app"></div>

  ${SHOW_REVIEW?'<div class="row">'+'<button id="wo">Wrong / unanswered only</button><button id="al">Show all</button>'+'</div>':''}</div>
  ${ps?`<div class="card"><h2>🎓 Your certificate</h2><canvas id="cv" style="width:100%;height:auto;border-radius:10px;border:1px solid var(--bd)"></canvas><div class="row" style="margin-top:12px"><button class="p" id="dc">Download certificate (PNG)</button><span class="m">ID: ${cid}</span></div></div>`:''}
  <div class="card"><h2>Performance by topic</h2>${ts.length?ts.map(x=>`<div style="margin:12px 0"><div class="row sp"><span>${esc(TOPICS[x.t])}</span><span class="m">${x.c}/${x.n} · <b style="color:var(--${col(x.p)})">${x.p}%</b></span></div><div class="pbar"><i style="width:${x.p}%;background:var(--${col(x.p)})"></i></div></div>`).join(''):'<div class="m">Not enough data.</div>'}</div>
  <div class="card"><h2>🎯 Where to focus</h2>${weak.length?weak.map((x,i)=>`<div style="margin:12px 0"><b>${i+1}. ${esc(TOPICS[x.t])}</b> <span class="tag">${x.p}%</span><div class="m" style="margin-top:4px">${esc(TIPS[x.t])}</div></div>`).join('')+'<div class="m">Revise these first, then take another full practice run.</div>':'<div class="m">You are above the pass mark in every topic — keep your edge with mixed, timed practice.</div>'}</div>
  <div id="rv"></div>`;
  if(ps){const cv=document.getElementById('cv');drawCert(cv);dc.onclick=()=>dlCert(cv)}
  if(!SHOW_REVIEW)return;
  const rv=document.getElementById('rv');
  const show=w=>{rv.innerHTML=S.qs.map((q,i)=>{const a=S.ans[i],good=a===q.a;if(w&&good)return'';
    return `<div class="card"><div class="m">Q${i+1} · ${a===undefined?'Unanswered':good?'Correct':'Wrong'}${S.fl[i]?' · flagged':''}</div><div class="q">${esc(q.q)}</div>
    ${q.o.map((o,j)=>`<div class="o ${j===q.a?'ok':j===a?'no':''}"><b>${'ABCD'[j]})</b><span>${esc(o)}</span></div>`).join('')}</div>`}).join('')||'<div class="card">Nothing to review 🎉</div>'};
  show(true);wo.onclick=()=>show(true);al.onclick=()=>show(false);
}
function toast(m,bad){let b=document.getElementById('tt');if(b)b.remove();b=document.createElement('div');b.id='tt';b.textContent=m;b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:99;max-width:92vw;padding:12px 20px;border-radius:14px;font-weight:700;color:#fff;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);border:1px solid rgba(255,226,176,.6);background:'+(bad?'#b3261e':'linear-gradient(135deg,#3d0b20,#a02a4b)');document.body.appendChild(b);setTimeout(()=>b.remove(),9000)}
function alerts(l){if(S.done||l<=0)return;for(const t of [600,1800]){if(l<=t&&!(S.al||[]).includes(t)){S.al=(S.al||[]).concat([600,1800].filter(x=>x>=t));sv();toast(t===600?'⏰ 10 minutes remaining — finish up and check your flagged questions':'⏰ 30 minutes remaining',t===600);return}}}
function warn(){let b=document.getElementById('wn');if(!b){b=document.createElement('div');b.id='wn';b.style.cssText='position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:99;background:#c0392b;color:#fff;padding:12px;text-align:center;font-weight:600;cursor:pointer';document.body.appendChild(b)}b.textContent='⚠ You left the exam window ('+S.sw+'/'+MAXSW+'). At '+MAXSW+' the exam is submitted automatically. (tap to dismiss)';b.onclick=()=>b.remove()}
function viol(){if(busy||!S||S.done||S.md!=='exam')return;const t=Date.now();if(t-lastV<1500)return;lastV=t;S.sw=(S.sw||0)+1;sv();if(S.sw>=MAXSW){finish();return}warn()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)viol()});
window.addEventListener('blur',viol);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)viol()});
['contextmenu','copy','cut','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.tagName!=='INPUT')e.preventDefault()}));
document.addEventListener('selectstart',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
document.addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey,inp=e.target.tagName==='INPUT';
 if(k==='f12'||(c&&e.shiftKey&&['i','j','c'].includes(k))||(c&&['s','p','u'].includes(k))||(!inp&&c&&['c','x','a'].includes(k))||k==='printscreen'){e.preventDefault();if(k==='printscreen'){try{navigator.clipboard.writeText('')}catch(_){}}}});
(function(){const o=ld();if(o&&o.done){S=o;result()}else home()})();
</script></body></html>
